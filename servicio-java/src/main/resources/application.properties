server.port=8080
spring.application.name=servicio-transacciones

# Los mensajes de error (por ejemplo "La categoría no existe en el catálogo")
# llegan al frontend: sin esto Spring devuelve solo "Bad Request".
server.error.include-message=always

spring.datasource.url=${DATABASE_URL_FINANZAS}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}

# Redis Streams (comunicación entre microservicios)
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
eventos.stream.nombre=${REDIS_EVENTOS_STREAM:eventos:finanzas}
eventos.group.java=${EVENTOS_GROUP_JAVA:java}
eventos.consumer.java=${EVENTOS_CONSUMER_JAVA:java-1}