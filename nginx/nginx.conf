events {}

http {
  server {
    listen 80;

    # Auth (Node.js)
    location /api/auth/ {
      proxy_pass http://servicio-node:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Transacciones (Java)
    location /api/transacciones/ {
      proxy_pass http://servicio-java:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reportes (Python)
    location /api/reportes/ {
      proxy_pass http://servicio-python:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Metas (Go)
    location /api/metas/ {
      proxy_pass http://servicio-go:3002;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health checks directos (para pruebas)
    location /health/auth/ {
      proxy_pass http://servicio-node:3001/health;
    }
    location /health/transacciones/ {
      proxy_pass http://servicio-java:8080/health;
    }
    location /health/reportes/ {
      proxy_pass http://servicio-python:8000/health;
    }
    location /health/metas/ {
      proxy_pass http://servicio-go:3002/health;
    }
  }
}
