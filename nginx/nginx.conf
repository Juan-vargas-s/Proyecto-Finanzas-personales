events {}

http {
  # DNS de Docker — resolver en cada petición (evita IPs cacheadas al reiniciar contenedores)
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    # Auth (Node.js)
    location /api/auth/ {
      set $upstream_auth http://servicio-node:3001;
      proxy_pass $upstream_auth;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Transacciones (Java)
    location /api/transacciones/ {
      set $upstream_trans http://servicio-java:8080;
      proxy_pass $upstream_trans;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reportes (Python)
    location /api/reportes/ {
      set $upstream_rep http://servicio-python:8000;
      proxy_pass $upstream_rep;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Metas (Go)
    location /api/metas/ {
      set $upstream_metas http://servicio-go:3002;
      proxy_pass $upstream_metas;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health checks directos (para pruebas)
    location = /health/auth/ {
      set $upstream_health_auth http://servicio-node:3001/health;
      proxy_pass $upstream_health_auth;
    }
    location = /health/transacciones/ {
      set $upstream_health_trans http://servicio-java:8080/health;
      proxy_pass $upstream_health_trans;
    }
    location = /health/reportes/ {
      set $upstream_health_rep http://servicio-python:8000/health;
      proxy_pass $upstream_health_rep;
    }
    location = /health/metas/ {
      set $upstream_health_metas http://servicio-go:3002/health;
      proxy_pass $upstream_health_metas;
    }
  }
}
