services:
  # ========== BASES DE DATOS ==========
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME_AUTH}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME_AUTH}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
      - dbhost

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # ========== MICROSERVICIOS ==========
  servicio-node:
    build: ./servicio-node
    environment:
      PORT: 3001
      DATABASE_URL_AUTH: ${DATABASE_URL_AUTH}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  servicio-java:
    build: ./servicio-java
    environment:
      DATABASE_URL_FINANZAS: jdbc:postgresql://postgres:5432/${DB_NAME_FINANZAS}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - backend

  servicio-python:
    build: ./servicio-python
    environment:
      JAVA_SERVICE_URL: ${JAVA_SERVICE_URL}
    depends_on:
      servicio-java:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  servicio-go:
    build: ./servicio-go
    environment:
      REDIS_URL: ${REDIS_URL}
      JAVA_SERVICE_URL: ${JAVA_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3002
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  # ========== FRONTEND ==========
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_GATEWAY: ${NEXT_PUBLIC_API_GATEWAY}
    environment:
      NEXT_PUBLIC_API_GATEWAY: ${NEXT_PUBLIC_API_GATEWAY}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - frontend

  # ========== API GATEWAY ==========
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      servicio-node:
        condition: service_healthy
      servicio-java:
        condition: service_healthy
      servicio-python:
        condition: service_healthy
      servicio-go:
        condition: service_healthy
    networks:
      - frontend
      - backend

# ========== NETWORKS ==========
networks:
  frontend:
  backend:
    internal: true
  dbhost:

# ========== VOLUMES ==========
volumes:
  postgres_data:
  redis_data:
